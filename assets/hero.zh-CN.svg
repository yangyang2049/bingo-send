<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">Bingo Send — 说完 Bingo，自动发送。</title>
  <desc id="desc">流程示意：通过自己的输入法输入消息，句尾的 Bingo 触发发送；完整消息原样保留。macOS 13+，MIT 开源。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFCFA"/><stop offset="1" stop-color="#EDF5F1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#123D35" flood-opacity="0.06"/></filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .headline { fill:#172D2B; font-size:76px; font-weight:700; letter-spacing:-3px; }
    .headline.zh { font-size:66px; letter-spacing:-2px; }
    .label { fill:#52716A; font-size:13px; font-weight:650; letter-spacing:1.25px; }
    .message { fill:#253D38; font-size:27px; font-weight:500; }
  </style>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M643 114V534" stroke="#DCE8E1" stroke-width="1"/>
  <g transform="translate(64 44) scale(.0625)">
    <rect x="80" y="80" width="864" height="864" rx="192" fill="#126E6B"/>
    <path d="M248 504L778 260L586 778L472 586Z" fill="white"/>
    <path d="M472 586L778 260" fill="none" stroke="#126E6B" stroke-width="21" stroke-linecap="round"/>
  </g>
  <text x="142" y="87" fill="#172D2B" font-size="30" font-weight="650" letter-spacing="-.7">Bingo Send</text>
  <rect x="1099" y="59" width="117" height="27" rx="13.5" fill="#E3EFE9"/>
  <text x="1157.5" y="77.5" text-anchor="middle" fill="#32695B" font-size="11" font-weight="650" letter-spacing=".7">OPEN SOURCE</text>
  <text x="64" y="224" class="headline zh">说完 <tspan fill="#126E6B">Bingo</tspan>，</text>
  <text x="64" y="306" class="headline zh">自动发送。</text>
  <text x="66" y="366" fill="#5B716A" font-size="26" font-weight="400">继续用你喜欢的输入法。</text>
  <g transform="translate(66 418)">
    <rect width="156" height="32" rx="16" fill="#E1EFE9"/>
    <circle cx="18" cy="16" r="4" fill="#126E6B"/>
    <text x="32" y="21" fill="#397064" font-size="12" font-weight="650" letter-spacing=".55">句尾口令</text>
    <rect x="164" width="88" height="32" rx="16" fill="#FFFFFF" stroke="#D4E4DA"/>
    <text x="208" y="22" text-anchor="middle" fill="#126E6B" font-size="17" font-weight="650">Bingo</text>
  </g>
  <text x="704" y="140" class="label">流程示意</text>
  <rect x="704" y="161" width="512" height="148" rx="20" fill="#FFFFFF" stroke="#DFE8E2" filter="url(#shadow)"/>
  <text x="729" y="194" class="label">01  /  用自己的输入法</text>
  <text x="729" y="238" class="message">帮我看看这个页面，</text>
  <rect x="725" y="252" width="102" height="37" rx="9" fill="#E7F3ED"/>
  <text x="735" y="279" fill="#126E6B" font-size="27" font-weight="650">Bingo.</text>
  <path d="M959 324V347M950 339L959 348L968 339" fill="none" stroke="#126E6B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="704" y="366" width="512" height="148" rx="20" fill="#126E6B" filter="url(#shadow)"/>
  <text x="729" y="399" fill="#C2E5DC" font-size="13" font-weight="650" letter-spacing="1.15">02  /  自动发送</text>
  <text x="729" y="443" fill="#FFFFFF" font-size="27" font-weight="500">帮我看看这个页面，</text>
  <text x="729" y="484" fill="#FFFFFF" font-size="27" font-weight="650">Bingo.</text>
  <circle cx="1178" cy="400" r="12" fill="#FFFFFF" fill-opacity=".13"/>
  <path d="M1172 400L1176 404L1184 395" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="704" y="545" fill="#638075" font-size="16">完整消息原样保留，包含 Bingo。</text>
  <text x="66" y="564" fill="#5A756B" font-size="17" font-weight="500">macOS 13+ · 免费开源 · MIT</text>
  <text x="66" y="601" fill="#126E6B" font-size="20" font-weight="600" letter-spacing="-.2">github.com/yangyang2049/bingo-send</text>
</svg>
